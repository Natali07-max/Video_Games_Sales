<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXf8x40IW76VzdL6XUr1eoyhyOH9DWsfmOoMplPWLDoqhITC43aFKurz-Q&s=10');
        }

        .container{

            width:900px;

            margin:40px auto;

            background:white;

            padding:30px;

            border-radius:12px;

            box-shadow:0px 0px 15px rgba(0,0,0,0.2);

            text-align:center;

        }

        h1{

            color:#2c3e50;

            margin-bottom:20px;

        }

        h2{

            color:green;

            margin-top:20px;

        }

        img{

            width:700px;

            max-width:100%;

            margin-top:25px;

            border-radius:10px;

            border:1px solid #ccc;

        }

        .btn{

            display:inline-block;

            margin-top:30px;

            background:green;

            color:white;

            padding:12px 30px;

            text-decoration:none;

            border-radius:6px;

            font-size:18px;

        }

        .btn:hover{

            background:darkgreen;

        }



    </style>

</head>

<body>

<div class="container">

    <h1>Video Game Sales Prediction </h1>

    <h2>Predicted Global Sales</h2>

    <h1>{{ prediction }} Million Units</h1>

    <hr><br>

    <h2>Prediction Analysis</h2>

    <img  src="{{ url_for('static', filename='platform_sales.png') }}"
     alt="Platform Sales Graph"
     width="700">

    <br><br>

    <a href="/" class="btn">Predict Another Game</a>

</body>
</html>
